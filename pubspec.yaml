name: caremode
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  speech_to_text: ^7.3.0
  flutter_tts: ^4.0.2

  # FastAPI 통신 + Firebase Custom Token 로그인
  dio: ^5.4.0
  firebase_auth: ^6.0.0
  flutter_secure_storage: ^9.0.0

  # ▼▼▼ 라이브러리 정리 (중복 제거 완료) ▼▼▼
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.40
  cached_network_image: ^3.2.3
  video_player: ^2.7.2
  permission_handler: ^12.0.1
  call_log: ^6.0.1
  intl: ^0.20.2
  firebase_core: ^4.2.1
  firebase_messaging: ^16.1.0  # ✅ FCM 알림 (firebase_core 4.x 호환)
  cloud_firestore: ^6.1.0
  geolocator: ^14.0.2
  battery_plus: ^7.0.0
  flutter_notification_listener: ^1.3.4
  camera: ^0.11.0+1
  http: ^1.2.2
  http_parser: ^4.0.2
  web_socket_channel: ^3.0.0
  sound_stream: ^0.4.2
  porcupine_flutter: ^4.0.0  # ✅ 4.0.0으로 업그레이드
  image: ^4.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  geocoding: ^3.0.0
  vibration: ^2.0.1
  firebase_storage: ^13.0.5
  flutter_phone_call_state: ^0.1.0
  # just_audio 중복 제거
  saf_util: ^0.11.0
  saf_stream: ^0.12.3
  video_compress: ^3.1.3
  workmanager: ^0.5.1

  # 로컬 푸시알림
  flutter_local_notifications: ^17.1.2
  record: ^6.0.0
  awesome_snackbar_content: ^0.1.8
  shared_storage: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # ▼▼▼ Assets 설정 ▼▼▼
  assets:
    - assets/keywords/
